<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; text-align: center; background:#ffffff;">
  <h2 style="color:#111827; margin: 0 0 8px; font-size: 22px;">Código de verificación</h2>
  <p style="color:#6b7280; font-size: 14px; margin: 0 0 24px;">
    Usa el siguiente código para iniciar sesión en Campus Virtual.
  </p>

  <div style="font-size: 40px; font-weight: 800; letter-spacing: 10px; color:#2563eb; background:#eff6ff; padding: 20px; border-radius: 12px; margin: 0 0 24px; display:inline-block; min-width: 220px;">
    {{ .Token }}
  </div>

  <p style="color:#9ca3af; font-size: 13px; margin: 0;">
    El código sólo puede usarse una vez y es válido por 5 minutos.
  </p>
  <p style="color:#9ca3af; font-size: 13px; margin: 16px 0 0;">
    Si tú no solicitaste este código, puedes ignorar este correo con
    tranquilidad.
  </p>
</div>
